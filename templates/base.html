<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{% static 'authentication/css/styles.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>{% block title %}My Django App{% endblock %}</title>
</head>
<body class="{% block body_class %}default-body{% endblock %}">
    {% if request.path == '/' %}
    <header class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand me-auto" href="#">
                <img src="{% static 'images/logo.png' %}" height="55px" width="65px" alt="Logo" class="logo">
                <span>Faux Vision</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="ms-5 nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="ms-5 nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="ms-5 nav-link" href="#">Services</a></li>
                    <li class="nav-item"><a class="ms-5 nav-link" href="#">Contact</a></li>
                </ul>
                <a class="ms-auto me-3 btn btn-dark" href="{% url 'auth' %}">Login</a>
            </div>
        </div>
    </header>
    {% endif %}
    <main>
        {% block content %}
        <!-- Content from child templates will go here -->
        {% endblock %}
    </main>
    <!-- {% if request.path != '/auth/' and request.path != '/predict/' %}
    <footer>
        <p>&copy; 2025 My Django App</p>
    </footer>
    {% endif %} -->
    <!-- <script src="{% static 'authentication/js/scripts.js' %}"></script> -->
    <script src="{% static 'js/script.js' %}?v=1"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
